[pytest]
minversion = 7.0
addopts = -ra -m "not integration" -n auto
testpaths =
    tests
markers =
    unit: Unit tests that mock external integrations and run quickly.
    integration: Integration tests that require real external services.
    e2e: End-to-end tests that require full lab environments (GOAD/HTB/etc.).
    ce: BloodHound CE integration tests.

# ── Parallel by default (pytest-xdist, the ``-n auto`` above) ────────
# The suite is ~13.2k tests. In one process it takes about ten minutes, which
# is why a push to `dev` used to skip it: thirty commits a day would occupy the
# single self-hosted runner for seven hours, and the workflow's concurrency rule
# would cancel most of those runs before they produced a result. Across the
# cores of this machine the same suite takes about 84 seconds, which fits both
# on every push and in the pre-commit loop CLAUDE.md asks for.
#
# Measured 2026-08-02 on a 24-physical / 32-logical core i9-14900HX, whole
# suite, wall clock:
#
#     -n auto   (24 workers, dist=load)       83.7s
#     -n logical(32 workers, dist=load)       84.0s   hyperthread siblings buy nothing
#     -n auto   --dist loadfile              106.3s   file sizes are too uneven
#
# Why each part:
#
#   * ``auto`` resolves to PHYSICAL cores (psutil), ``logical`` to all threads.
#     They measured the same, so ``auto`` wins on the tie: it leaves the
#     hyperthread siblings for everything else on a machine that is also
#     somebody's workstation AND the self-hosted CI runner, and it scales down
#     honestly on a 4-core laptop. A fixed worker count is wrong for a repo
#     cloned onto different machines.
#   * The default ``load`` distribution (per test) beats ``loadfile`` by 23s
#     because a handful of very large files would otherwise own the critical
#     path. It also interleaves tests arbitrarily, which keeps the suite proving
#     its own isolation rather than letting file grouping hide a leak — the
#     failure that motivated this was exactly such a leak (see
#     ``_isolate_outbound_telemetry`` in tests/conftest.py).
#
# Why a DEFAULT rather than something you opt into: an agent or a contributor
# running ``uv run pytest -m unit`` gets the fast suite without knowing to ask,
# and CI needs no flag of its own. The cost lands only on the narrowest possible
# selection — a single test by node id pays about 1.2s of worker startup (0.8s →
# 2.0s). One file is already faster in parallel (5.9s → 4.7s), and everything
# larger is much faster.
#
# Turn it off with ``-n0`` for a single-process run. Do that when you need
# ``-s`` / ``--capture=no``, ``--pdb``, or strictly ordered output, none of
# which behave under xdist:
#
#     uv run pytest -n0 -s --pdb tests/unit/test_foo.py::test_bar
#
# Anything that must not run concurrently with a sibling belongs behind a
# fixture that isolates it, not behind a serial run. Two workers sharing a
# directory or a module global is a defect in the test, and it is a defect
# whether or not xdist is the thing that exposes it.

# ── Per-test timeout (pytest-timeout) ───────────────────────────────
# Convert hung tests into explicit failures instead of stalling CI.
#
# History: a CI hang on 2026-05-21 came from an infinite re-prompt loop
# inside ``offer_attack_paths_for_execution_summaries`` triggered by a
# test that mocked the questionary picker to always select the same
# path. The loop spun in pure Python with no I/O, never asserted, never
# raised — pytest had no signal to stop. The CI runner kept the job
# alive until its hour-long job timeout fired, reporting "cancelled"
# rather than "test failed". With the budget below, pytest kills the
# offending test after 60s and surfaces a stack trace pointing at the
# real culprit, turning multi-hour CI black-outs into 60-second
# diagnostics.
#
# Budget choice — 60s per test:
#   * Generous enough for legitimately slow unit tests (the slowest
#     ones in this repo are ~30s — graph regression suites).
#   * Tight enough that an accidental infinite loop fails fast.
#   * Individual tests can override with ``@pytest.mark.timeout(N)``
#     when they have a documented reason to need more.
#
# Method choice — ``thread`` over ``signal``:
#   * ``signal`` (default) only fires when the test is back at the
#     Python interpreter level. A C-extension or syscall that blocks
#     indefinitely sails past it. ``thread`` runs the test in a worker
#     thread and the timer in the main thread, so the deadline always
#     fires.
#   * Slight tradeoff: ``thread`` is less precise for test isolation
#     because the worker thread inherits process-wide state. For unit
#     tests that already mock external state this is fine; integration
#     tests that need their own process should use ``--forked`` (not
#     enabled by default).
timeout = 60
timeout_method = thread
