#
# ADscan bundled John the Ripper rule ladder.
#
# The GPU backend (hashcat) walks a 4-rung effort ladder built from hashcat
# `.rule` files (bare -> best64 -> OneRule-10k -> OneRule-full). John the Ripper
# does NOT read hashcat `.rule` files: it applies named rule sections from its
# own config, selected via `--rules=<name>`. This file defines the John-native
# rule sections that approximate the same escalating ladder so the CPU backend
# has an equivalent effort progression.
#
# Functional parity, NOT byte-identical to the hashcat ladder -- that is
# expected and by design. hashcat mangling rules and John rules have different
# dialects and different built-in wordlist behaviour; these sections aim to
# reproduce the ROUGH keyspace escalation (rung 1 compact/fast, rung 2 medium,
# rung 3 strongest), not to translate individual rules one-for-one.
#
# Ladder mapping (see adscan_internal/services/cracking/john_rules.py):
#   rung 0 -> (no rules)          bare wordlist, no --rules flag
#   rung 1 -> adscan_r1           compact/fast  (best64-equivalent)
#   rung 2 -> adscan_r2           medium        (stronger than r1)
#   rung 3 -> adscan_r3           strongest bundled ruleset
#
# A bundled conf must be self-contained: John Jumbo ships best64/KoreLogic/Jumbo
# rulesets, but we define our own explicit sections so the ladder is stable and
# independent of which John build is installed on the host.
#

# ---------------------------------------------------------------------------
# rung 1 -- adscan_r1: compact, fast. best64-equivalent high-yield mangles.
# ---------------------------------------------------------------------------
[List.Rules:adscan_r1]
# try the word as-is
:
# lowercase / uppercase / capitalize
l
u
c
# capitalize + append a single digit 0-9
c $[0-9]
# append a single digit to the plain word
$[0-9]
# append two digits (00-99) -- common "word12" pattern
$[0-9] $[0-9]
# append the classic exclamation suffix
$!
c $!
# append a year-ish 19xx / 20xx tail
$1 $9 $[0-9] $[0-9]
$2 $0 $[0-9] $[0-9]
# reverse the word
r

# ---------------------------------------------------------------------------
# rung 2 -- adscan_r2: medium. r1 plus leetspeak and richer suffixes.
# ---------------------------------------------------------------------------
[List.Rules:adscan_r2]
# everything r1 does, spelled out (sections do not inherit)
:
l
u
c
c $[0-9]
$[0-9]
$[0-9] $[0-9]
$!
c $!
$1 $9 $[0-9] $[0-9]
$2 $0 $[0-9] $[0-9]
r
# leetspeak single-character substitutions
sa@
se3
si1
so0
ss$
# capitalize + leet the 'a'
c sa@
# capitalize + append common special-char suffixes
c $! $!
c $@
c $#
c $. $[0-9]
# append the three most common weak passwords' tails
$1 $2 $3
$1 $2 $3 $4
# prepend a digit
^[0-9]
# toggle case of the first character
T0

# ---------------------------------------------------------------------------
# rung 3 -- adscan_r3: strongest bundled ruleset. r2 plus combined leet,
# multi-digit tails, and season/keyboard patterns.
# ---------------------------------------------------------------------------
[List.Rules:adscan_r3]
# everything r2 does, spelled out
:
l
u
c
c $[0-9]
$[0-9]
$[0-9] $[0-9]
$!
c $!
$1 $9 $[0-9] $[0-9]
$2 $0 $[0-9] $[0-9]
r
sa@
se3
si1
so0
ss$
c sa@
c $! $!
c $@
c $#
c $. $[0-9]
$1 $2 $3
$1 $2 $3 $4
^[0-9]
T0
# combined leetspeak across multiple characters
sa@ se3
sa@ se3 so0
sa@ se3 si1 so0 ss$
# capitalize + full leet + digit tail
c sa@ se3 so0 $[0-9]
# append three digits (000-999)
$[0-9] $[0-9] $[0-9]
# capitalize + append year 2000-2029
c $2 $0 $[0-2] $[0-9]
# common "!@#" keyboard-walk suffix
c $! $@ $#
# capitalize + append a special char and two digits
c $! $[0-9] $[0-9]
# duplicate the word (wordword)
d
# capitalize + reverse
c r
